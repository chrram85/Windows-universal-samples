name: build-uwp
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).Name
          msbuild Samples\Simple3DGameDX\cpp\Simple3DGameDX.sln /restore `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=$sdk `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appx
          path: |
            **/AppPackages/**
            **/*.msix
            **/*.appx
